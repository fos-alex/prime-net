[project]
name = "primenet"
version = "0.1.0"
description = "Can a neural net learn primality? A reproducible CPU-only PyTorch experiment."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.scripts]
primenet-train = "primenet.train:main"
primenet-eval = "primenet.evaluate:main"
primenet-serve = "primenet.serve:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
